services:
  web:
    image: node:20-bookworm
    working_dir: /workspace
    network_mode: host
    env_file:
      - .env
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=4096
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
    command: bash -lc "yarn install --frozen-lockfile && yarn dev --host 0.0.0.0 --port 3000"
